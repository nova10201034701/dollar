<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>قیمت لحظه‌ای بازار</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(59,130,246,.18),transparent 30%),radial-gradient(circle at 85% 20%,rgba(99,102,241,.15),transparent 28%),radial-gradient(circle at 50% 90%,rgba(16,185,129,.08),transparent 30%),#070b14;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent)}
.app{width:100%;max-width:520px;margin:auto;padding:18px 15px 25px;position:relative;z-index:2}
.hero{position:relative;overflow:hidden;padding:22px 20px;margin-bottom:18px;border-radius:28px;background:linear-gradient(135deg,rgba(30,41,59,.85),rgba(15,23,42,.72));border:1px solid rgba(255,255,255,.09);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.05);backdrop-filter:blur(18px)}
.hero::after{content:"";position:absolute;width:160px;height:160px;top:-80px;left:-60px;background:rgba(59,130,246,.25);filter:blur(50px);border-radius:50%}
.hero-content{position:relative;z-index:2}.live-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#6ee7b7;font-size:11px;font-weight:700;margin-bottom:13px}
.live-dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.75)}}
.title{font-size:26px;font-weight:900;background:linear-gradient(90deg,#60a5fa,#818cf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.subtitle{color:#94a3b8;font-size:12px;margin-top:7px}.update-row{display:flex;justify-content:space-between;align-items:center;margin:15px 2px 12px;color:#64748b;font-size:11px;gap:8px}
.refresh-btn{border:0;outline:none;display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:12px;color:#cbd5e1;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:.2s;white-space:nowrap}
.refresh-btn:active{transform:scale(.94)}.refresh-icon{font-size:14px}.refreshing .refresh-icon{animation:rotate .7s linear infinite}@keyframes rotate{to{transform:rotate(360deg)}}
.price-card{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:17px;margin-bottom:11px;border-radius:21px;background:linear-gradient(135deg,rgba(30,41,59,.82),rgba(15,23,42,.72));border:1px solid rgba(255,255,255,.075);box-shadow:0 10px 30px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.025);backdrop-filter:blur(16px);animation:cardIn .45s ease both;transition:transform .2s,border-color .2s,background .2s}
.price-card:active{transform:scale(.985)}.price-card:hover{border-color:rgba(99,102,241,.25)}@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.coin-icon{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);font-size:21px;flex-shrink:0}
.price-info{display:flex;align-items:center;gap:12px;min-width:0}.price-name{font-size:14px;font-weight:700;color:#e2e8f0}.price-description{font-size:10px;color:#64748b;margin-top:3px}.price-value{text-align:left;flex-shrink:0;max-width:58%}
.value{font-size:16px;font-weight:900;color:#6ee7b7;direction:ltr;unicode-bidi:plaintext}.unit{font-size:9px;color:#64748b;margin-right:4px;white-space:nowrap}
.change{display:inline-flex;align-items:center;justify-content:center;margin-top:5px;padding:3px 7px;border-radius:7px;font-size:10px;font-weight:700;max-width:100%;white-space:normal;text-align:center;direction:rtl}
.up{color:#34d399;background:rgba(16,185,129,.1)}.down{color:#fb7185;background:rgba(244,63,94,.1)}.same{color:#94a3b8;background:rgba(148,163,184,.08)}
.loading{padding:18px;border-radius:21px;background:rgba(30,41,59,.65);border:1px solid rgba(255,255,255,.07);color:#64748b;text-align:center;font-size:12px}.loading-bar{width:80%;height:4px;margin:10px auto 0;border-radius:20px;background:linear-gradient(90deg,transparent,#6366f1,transparent);animation:loading 1.3s infinite}
@keyframes loading{from{transform:translateX(-30%);opacity:.3}50%{opacity:1}to{transform:translateX(30%);opacity:.3}}
.error{padding:18px;border-radius:20px;text-align:center;color:#fb7185;background:rgba(244,63,94,.07);border:1px solid rgba(244,63,94,.15);font-size:12px}
footer{text-align:center;margin-top:25px;color:#475569;font-size:10px}.footer-brand{color:#64748b;font-weight:700}
@media(max-width:360px){.price-card{padding:13px}.price-info{gap:8px}.coin-icon{width:40px;height:40px}.price-name{font-size:12px}.value{font-size:14px}.unit{font-size:8px}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><div class="hero-content"><div class="live-badge"><span class="live-dot"></span> LIVE MARKET</div><div class="title">📊 قیمت لحظه‌ای بازار</div><div class="subtitle">آخرین قیمت ارز، طلا، سکه و رمزارزها</div></div></header>
<div class="update-row"><span id="last-update">در حال دریافت اطلاعات...</span><button class="refresh-btn" id="refresh-btn" onclick="manualRefresh()"><span class="refresh-icon">↻</span> بروزرسانی</button></div>
<div id="price-list"><div class="loading">در حال دریافت قیمت‌ها...<div class="loading-bar"></div></div></div>
<footer><div>داده‌ها به‌صورت خودکار بروزرسانی می‌شوند</div><div class="footer-brand">🚀 Powered by Nova Market</div></footer>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.expand(); try { tg.setHeaderColor("#070b14"); tg.setBackgroundColor("#070b14"); } catch (e) {} }

const names = {
  dollar:{title:"دلار آزاد",description:"USD / IRR",icon:"💵",unit:"تومان"},
  euro:{title:"یورو",description:"EUR / IRR",icon:"💶",unit:"تومان"},
  usdt:{title:"تتر",description:"USDT / IRR",icon:"💲",unit:"تومان"},
  btc:{title:"بیت‌کوین",description:"BTC / USD",icon:"₿",unit:"دلار"},
  gold18:{title:"طلای ۱۸ عیار",description:"Gold 18K",icon:"🥇",unit:"تومان"},
  coin:{title:"سکه تمام",description:"Emami Coin",icon:"🪙",unit:"تومان"},
  ounce:{title:"اونس جهانی",description:"Gold Ounce",icon:"🌍",unit:"دلار"}
};

// Snapshot محلی؛ برای مقایسه بین دریافت‌های خود همین مینی‌اپ
const SNAPSHOT_KEY = "nova_market_5min_snapshot_v1";
const SNAPSHOT_INTERVAL = 5 * 60 * 1000;
let previousSnapshot = loadSnapshot();
let lastAutoSnapshotAt = previousSnapshot?.timestamp || 0;
let isFetching = false;

function loadSnapshot() {
  try {
    const saved = JSON.parse(localStorage.getItem(SNAPSHOT_KEY));
    if (!saved || !saved.prices || !Number.isFinite(Number(saved.timestamp))) return null;
    return saved;
  } catch (e) { return null; }
}

function saveSnapshot(prices, timestamp) {
  const snapshot = {timestamp, prices};
  try { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(snapshot)); } catch (e) { console.warn("Snapshot ذخیره نشد:", e); }
  previousSnapshot = snapshot;
  lastAutoSnapshotAt = timestamp;
}

function formatNumber(value, maximumFractionDigits = 2) {
  return Number(value).toLocaleString("fa-IR", {maximumFractionDigits});
}

function getChange(current, old) {
  if (old === undefined || old === null || !Number.isFinite(Number(old)) || Number(old) === 0) {
    return {className:"same", text:"⚪ بدون سابقه"};
  }
  const diff = current - Number(old);
  const percent = (diff / Number(old)) * 100;
  if (diff > 0) return {className:"up", text:`▲ +${formatNumber(diff)} (${formatNumber(percent, 2)}٪)`};
  if (diff < 0) return {className:"down", text:`▼ ${formatNumber(diff)} (${formatNumber(percent, 2)}٪)`};
  return {className:"same", text:"— بدون تغییر"};
}

async function fetchPrices(showLoading = false, automatic = false) {
  if (isFetching) return;
  isFetching = true;
  const button = document.getElementById("refresh-btn");
  button.classList.add("refreshing");
  if (showLoading) {
    document.getElementById("price-list").innerHTML = '<div class="loading">دریافت آخرین قیمت‌ها...<div class="loading-bar"></div></div>';
  }

  try {
    // جلوگیری از کش مرورگر و پراکسی
    const response = await fetch(`/api/prices?_=${Date.now()}`, {cache:"no-store", headers:{"Cache-Control":"no-cache"}});
    if (!response.ok) throw new Error(`Server Error: ${response.status}`);
    const data = await response.json();
    const container = document.getElementById("price-list");
    const currentPrices = {};
    for (const key of Object.keys(names)) {
      if (data[key] && data[key].value !== undefined && Number.isFinite(Number(data[key].value))) {
        currentPrices[key] = Number(data[key].value);
      }
    }

    // قیمت‌ها با Snapshot قبلی نمایش داده می‌شوند؛ Snapshot فقط در نوبت خودکار ذخیره می‌شود.
    container.innerHTML = "";
    let index = 0;
    for (const [key, info] of Object.entries(names)) {
      if (currentPrices[key] === undefined) continue;
      const current = currentPrices[key];
      const old = previousSnapshot?.prices?.[key];
      const change = getChange(current, old);
      const card = document.createElement("div");
      card.className = "price-card";
      card.style.animationDelay = `${index * 0.06}s`;
      card.innerHTML = `
        <div class="price-info"><div class="coin-icon">${info.icon}</div><div><div class="price-name">${info.title}</div><div class="price-description">${info.description}</div></div></div>
        <div class="price-value"><div><span class="value">${formatNumber(current)}</span><span class="unit">${info.unit}</span></div><div class="change ${change.className}">${change.text}</div></div>`;
      container.appendChild(card);
      index++;
    }

    if (index === 0) {
      container.innerHTML = '<div class="error">⚠️ اطلاعاتی برای نمایش وجود ندارد</div>';
    } else if (automatic) {
      const now = Date.now();
      // اولین اجرای مینی‌اپ Snapshot اولیه می‌سازد؛ پس از آن هر ۵ دقیقه ثبت می‌شود.
      if (!previousSnapshot || now - lastAutoSnapshotAt >= SNAPSHOT_INTERVAL) {
        // ابتدا قیمت فعلی نسبت به Snapshot قبلی نمایش داده شده؛ سپس Snapshot فعلی ذخیره می‌شود.
        saveSnapshot(currentPrices, now);
      }
    }

    const now = new Date();
    document.getElementById("last-update").textContent = "آخرین دریافت: " + now.toLocaleTimeString("fa-IR", {hour:"2-digit", minute:"2-digit", second:"2-digit"});
  } catch (error) {
    console.error("خطا در دریافت قیمت‌ها:", error);
    if (!document.querySelector("#price-list .price-card")) {
      document.getElementById("price-list").innerHTML = '<div class="error">❌ خطا در دریافت اطلاعات<div style="margin-top:5px;opacity:.7">اتصال به سرور برقرار نشد</div></div>';
    }
  } finally {
    isFetching = false;
    setTimeout(() => button.classList.remove("refreshing"), 400);
  }
}

function manualRefresh() { fetchPrices(true, false); }

// دریافت اولیه و سپس به‌روزرسانی پنج‌دقیقه‌ای
fetchPrices(false, true);
setInterval(() => fetchPrices(false, true), SNAPSHOT_INTERVAL);
</script>
</body>
</html>
